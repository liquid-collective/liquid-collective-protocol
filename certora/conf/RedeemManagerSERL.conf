{
  // RedeemManagerSERLHarness is the ONLY contract in the scene. River and the Allowlist are summarised
  // as NONDET in the spec, so the rules hold for an arbitrary River rather than a pinned one. This is
  // also what makes the conf runnable: every other RedeemManager conf lists certora/harness/RiverV1Harness.sol,
  // which does not compile against the post-LibOracleReporting architecture (see certora/README.md).
  "files": [
    "certora/harness/RedeemManagerSERLHarness.sol",
  ],
  "verify": "RedeemManagerSERLHarness:certora/specs/RedeemManagerSERL.spec",
  "rule_sanity": "basic",
  // _sliceCap walks one mark boundary per iteration and _findRateMarkAtOrBefore binary-searches the
  // stack; 3 covers slices spanning up to three marks. Raise to widen coverage, at the usual cost.
  "loop_iter": "3",
  "optimistic_loop": true,
  // the recipient payout is a raw `.call{value}("")` with no return data
  "optimistic_fallback": true,
  "packages": ["openzeppelin-contracts=lib/openzeppelin-contracts"],
  // _claimRedeemRequest recurses when a request overflows its withdrawal event; the claim rules here
  // pass depth 0, so one level is enough
  "prover_args": [
    " -recursionErrorAsAssert false",
    " -s z3",
  ],
  "optimistic_summary_recursion": true,
  "summary_recursion_limit": "1",
  "parametric_contracts": ["RedeemManagerSERLHarness"],
  // no "solc" key: CI pins the compiler with solc-select (see .github/workflows/Certora.yaml).
  // Locally, pass --solc "$HOME/.solc-select/artifacts/solc-0.8.34/solc-0.8.34" or `solc-select use 0.8.34`.
  "msg": "RedeemManagerV1 stopped-earning rate lock (SERL) properties",
}
